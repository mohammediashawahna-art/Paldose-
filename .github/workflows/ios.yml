name: PALDOSE iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15

    steps:
      - name: Checkout mobile-app
        uses: actions/checkout@v4
        with:
          ref: mobile-app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Add iOS
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Verify iOS Project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          echo "iOS Xcode project exists"

      - name: Build iOS App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify Build
        run: |
          test -d build/Build/Products/Release-iphoneos/App.app
          echo "PALDOSE iOS app built successfully"

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: PALDOSE-iOS-App
          path: build/Build/Products/Release-iphoneos/App.app
          retention-days: 7
