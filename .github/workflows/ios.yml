name: PALDOSE IOS TEST

on:
  workflow_dispatch:

jobs:
  ios-test:
    name: IOS TEST - macOS
    runs-on: macos-15

    steps:
      - name: TEST - This is iOS Workflow
        run: |
          echo "======================================"
          echo "PALDOSE IOS WORKFLOW IS RUNNING"
          echo "======================================"
          echo "Runner OS:"
          uname -a
          echo "Expected OS: macOS"

      - name: Checkout mobile-app
        uses: actions/checkout@v6
        with:
          ref: mobile-app

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Capacitor iOS package
        run: npm ls @capacitor/ios

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify iOS project
        run: |
          echo "======================================"
          echo "IOS PROJECT CREATED SUCCESSFULLY"
          echo "======================================"
          ls -la ios
          test -d ios
          test -f ios/App/App.xcodeproj/project.pbxproj
          echo "iOS Xcode project detected successfully."

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: PALDOSE-iOS-project
          path: ios
          retention-days: 7
