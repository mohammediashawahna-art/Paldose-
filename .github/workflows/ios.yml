name: PALDOSE iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15

    steps:
      - name: Checkout mobile-app
        uses: actions/checkout@v4
        with:
          ref: mobile-app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Add iOS
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Build iOS App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r PALDOSE.ipa Payload
          rm -rf Payload

      - name: Verify IPA
        run: |
          test -f PALDOSE.ipa
          echo "PALDOSE IPA created successfully"
          ls -lh PALDOSE.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PALDOSE-iOS-IPA
          path: PALDOSE.ipa
          retention-days: 7
