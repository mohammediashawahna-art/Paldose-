name: Build iOS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-project:
    runs-on: macos-15

    steps:
      - name: Checkout mobile-app
        uses: actions/checkout@v6
        with:
          ref: mobile-app

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Commit iOS project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git diff --cached --quiet || git commit -m "Add Capacitor iOS project"
          git push origin mobile-app
