name: Create iOS

on:
  workflow_dispatch:

jobs:
  build-ios-project:
    runs-on: macos-15

    steps:
      - name: Checkout mobile-app
        uses: actions/checkout@v6
        with:
          ref: mobile-app

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: PALDOSE-iOS-project
          path: ios
          retention-days: 7
